name: Fetch Encrypted Secrets

on:
  workflow_call:
    inputs:
      zip_url_json:
        required: true
        type: string
    secrets:
      GENURL:
        required: true
      RDGEN_BASIC_USER:
        required: true
      RDGEN_BASIC_PASSWORD:
        required: true

jobs:
  download-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Download with Retry
        uses: nick-fields/retry@v3
        env:
          RDGEN_URL: ${{ secrets.GENURL }}
          RDGEN_USER: ${{ secrets.RDGEN_BASIC_USER }}
          RDGEN_PASSWORD: ${{ secrets.RDGEN_BASIC_PASSWORD }}
          RDGEN_ZIP_URL_JSON: ${{ inputs.zip_url_json }}
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: python
          command: |
            import requests
            import json
            import os
            from urllib.parse import urlsplit

            input_data = json.loads(os.environ['RDGEN_ZIP_URL_JSON'])
            base_url = os.environ['RDGEN_URL'].rstrip('/')
            parsed_url = urlsplit(base_url)
            if (parsed_url.scheme != 'https' or not parsed_url.hostname
                    or parsed_url.username is not None or parsed_url.password is not None
                    or parsed_url.query or parsed_url.fragment):
                raise ValueError('GENURL must be an HTTPS URL without credentials, query, or fragment')
            username = os.environ['RDGEN_USER']
            password = os.environ['RDGEN_PASSWORD']
            if not username or not password:
                raise ValueError('RDGen Basic Auth secrets must be configured')
            url = f"{base_url}/get_zip"
            response = requests.get(url, params={'filename': input_data['file']}, auth=(username, password), timeout=20, allow_redirects=False)
            if response.status_code in (401, 403):
              raise RuntimeError(
                f'RDGen ZIP download denied (HTTP {response.status_code}). '
                'Verify RDGEN_BASIC_USER and RDGEN_BASIC_PASSWORD match the proxy machine account, '
                'and that the account is allowed on /get_zip at GENURL. '
                'Check proxy/WAF access logs for this request; retries cannot fix an access-policy denial.'
              )
            response.raise_for_status()
            if response.status_code != 200:
              raise RuntimeError(f'Unexpected download status: {response.status_code}')
            with open('secrets.zip', 'wb') as downloaded_file:
              downloaded_file.write(response.content)

      - name: Upload Encrypted Artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-secrets-zip
          path: secrets.zip
          retention-days: 1